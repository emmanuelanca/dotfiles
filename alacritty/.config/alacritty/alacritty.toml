[colors.primary]

background = '#282828'
foreground = '#ebdbb2'

[colors.normal]

black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]

black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[font]

normal = { family = "Perfect DOS VGA 437", style = "Regular" }
bold = { family = "Perfect DOS VGA 437", style = "Bold" }
italic = { family = "Perfect DOS VGA 437", style = "Italic" }
bold_italic = { family = "Perfect DOS VGA 437", style = "Bold Italic" }

size = 12.0

[window]

padding = { x = 4, y = 4 }
dynamic_padding = true
dimensions = { columns = 80, lines = 24 }
resize_increments = true
